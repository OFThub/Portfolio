name: Deploy to GitHub Pages

# dist/ is not committed, so Pages is built here instead of served from the
# repository. This is what replaced the old commit-the-build-output flow.
#
# Pages is a MIRROR, not the primary site: it cannot serve HTTP headers, so the
# CSP, HSTS and friends in vercel.json do not apply to it. If both are live,
# each build declares itself canonical, which splits search ranking between two
# copies of the same page -- run only one publicly, or point one at the other.
# Manual trigger only, deliberately. Pages is not enabled on this repository
# yet, so a push trigger would paint every commit red for a deployment nobody
# asked for. Once Settings -> Pages -> Source is set to "GitHub Actions", run
# this once from the Actions tab; add the push trigger back if you want the
# mirror to follow main automatically:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race; queue instead of cancelling so a
# deployment already in flight finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # OFThub/Portfolio is a project repository, so Pages serves it from a
          # sub-path. VITE_BASE_PATH is derived from this, so one variable is
          # enough and the two cannot drift apart.
          VITE_SITE_URL: https://ofthub.github.io/Portfolio
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      # ONE-TIME SETUP: enable Pages under
      #   Settings -> Pages -> Source -> "GitHub Actions"
      # then re-run this workflow. `enablement: true` was tried here and the
      # default GITHUB_TOKEN got a 403 creating the Pages site, so the switch
      # has to be flipped by a human once. After that this step just reads the
      # existing configuration and the workflow is self-sufficient.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
